<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Puzzle Exp＆Drop Calculator</title>
    <meta name="theme-color" content="#0b1020">
    <link rel="icon" type="image/png" sizes="64x64" href="./favicon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
    <link rel="manifest" href="./manifest.webmanifest">

    <style>
        :root {
            color-scheme: dark;
            --bg: #0b1020;
            --surface: rgba(22, 31, 53, .92);
            --surface-soft: #111a2e;
            --line: rgba(166, 190, 230, .14);
            --text: #f3f6ff;
            --muted: #aab6ce;
            --accent: #8b7cff;
            --accent-2: #49dfc1;
        }
        * { box-sizing: border-box; }
        body {
            min-height: 100vh;
            margin: 0;
            padding: 36px 18px;
            color: var(--text);
            font-family: Inter, "Hiragino Kaku Gothic ProN", "Yu Gothic UI", Meiryo, sans-serif;
            background: radial-gradient(ellipse at 12% 0%, rgba(95, 81, 210, .24), transparent 38%),
                        radial-gradient(ellipse at 100% 80%, rgba(32, 180, 157, .12), transparent 35%), var(--bg);
        }
        .container {
            width: min(100%, 760px);
            margin: 0 auto;
            padding: clamp(22px, 5vw, 42px);
            border: 1px solid var(--line);
            border-radius: 26px;
            background: linear-gradient(145deg, rgba(25, 35, 60, .97), rgba(15, 23, 41, .97));
            box-shadow: 0 28px 90px rgba(0, 0, 0, .38);
        }
        h1 {
            margin: 0 0 28px;
            text-align: center;
            font-size: clamp(25px, 5vw, 36px);
            letter-spacing: -.04em;
            line-height: 1.2;
            background: linear-gradient(100deg, #fff 24%, #a9a0ff 62%, #63e5cf);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        h2 { margin: 28px 0 18px; font-size: 21px; letter-spacing: -.02em; }
        label { display: block; margin: 18px 0 8px; color: #dbe3f5; font-size: 14px; font-weight: 650; }
        input, select {
            width: 100%;
            min-height: 48px;
            padding: 11px 14px;
            border: 1px solid var(--line);
            border-radius: 12px;
            outline: none;
            background: #0c1426;
            color: var(--text);
            font: inherit;
            font-size: 16px;
            transition: border-color .18s, box-shadow .18s, background .18s;
        }
        input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(139, 124, 255, .18); background: #101a30; }
        .radio-group { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
        .radio-group label {
            display: flex;
            flex: 1 1 160px;
            align-items: center;
            gap: 9px;
            min-height: 48px;
            margin: 0;
            padding: 10px 13px;
            border: 1px solid var(--line);
            border-radius: 12px;
            background: var(--surface-soft);
            color: #dbe3f5;
            font-weight: 500;
        }
        .radio-group input { width: 17px; height: 17px; margin: 0; accent-color: var(--accent); }
        .time-group { display: flex; align-items: center; gap: 10px; }
        .time-group input { min-width: 0; flex: 1; }
        .time-group span { color: var(--muted); }
        button {
            width: 100%;
            min-height: 50px;
            margin-top: 24px;
            padding: 13px 18px;
            border: 0;
            border-radius: 13px;
            background: linear-gradient(105deg, #7565ec, #9a72ed);
            box-shadow: 0 9px 24px rgba(112, 95, 230, .22);
            color: white;
            font: inherit;
            font-size: 16px;
            font-weight: 750;
            cursor: pointer;
            transition: transform .18s, filter .18s, box-shadow .18s;
        }
        button:hover { filter: brightness(1.1); transform: translateY(-1px); box-shadow: 0 12px 28px rgba(112, 95, 230, .3); }
        button:active { transform: translateY(0); }
        .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 0 0 26px; padding: 6px; border: 1px solid var(--line); border-radius: 15px; background: #0b1324; }
        .tabs button { min-height: 44px; margin: 0; padding: 10px; border-radius: 10px; background: transparent; box-shadow: none; color: var(--muted); font-size: 15px; }
        .tabs button:hover { transform: none; background: rgba(255,255,255,.05); }
        .tabs button[aria-selected="true"] { background: linear-gradient(105deg, #7565ec, #9a72ed); color: white; box-shadow: 0 5px 16px rgba(112, 95, 230, .25); }
        .panel[hidden] { display: none; }
        .result-box {
            margin-top: 22px;
            padding: 22px;
            border: 1px solid rgba(73, 223, 193, .2);
            border-radius: 17px;
            background: linear-gradient(145deg, rgba(27, 56, 68, .5), rgba(13, 25, 42, .86));
        }
        .result-title { margin-bottom: 12px; color: #c4d4e5; font-size: 14px; font-weight: 700; }
        .result, .drop-result { color: var(--accent-2); font-size: clamp(28px, 6vw, 38px); font-weight: 800; text-align: center; overflow-wrap: anywhere; }
        .easy-result, .run-easy-result { margin-top: 9px; color: #c1cce0; font-size: 16px; text-align: center; }
        .info { margin-top: 12px; color: var(--muted); font-size: 13px; line-height: 1.6; text-align: center; }
        .run-result { margin-top: 10px; color: #f4f6ff; font-size: clamp(24px, 5vw, 31px); font-weight: 800; text-align: center; }
        .note { color: var(--muted); font-size: 13px; line-height: 1.7; }
        @media (max-width: 520px) {
            body { padding: 14px 10px; }
            .container { padding: 22px 17px; border-radius: 20px; }
            h1 { margin-bottom: 22px; }
            .tabs { margin-bottom: 22px; }
            .result-box { padding: 18px 14px; }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Puzzle Exp＆Drop Calculator</h1>

        <div class="tabs" role="tablist" aria-label="計算機の切り替え">
            <button type="button" role="tab" id="expTab" aria-controls="expPanel" aria-selected="true">経験値計算</button>
            <button type="button" role="tab" id="dropTab" aria-controls="dropPanel" aria-selected="false">ドロップ率計算</button>
        </div>

        <section class="panel" id="expPanel" role="tabpanel" aria-labelledby="expTab">

        <h2>基本設定</h2>

        <label for="normalExp">
            通常経験値
        </label>

        <input
            type="number"
            id="normalExp"
            value="80000000"
            min="0"
        >

        <label for="collab">
            コラボ・イベントキャラクター数（1体につき+4000万）
        </label>

        <input
            type="number"
            id="collab"
            value="0"
            min="0"
            max="6"
        >

        <label>
            経験値バッジ
        </label>

        <div class="radio-group">
            <label>
                <input
                    type="radio"
                    name="badge"
                    value="1"
                    checked
                >
                なし
            </label>

            <label>
                <input
                    type="radio"
                    name="badge"
                    value="1.1"
                >
                あり（×1.1）
            </label>
        </div>

        <label>
            パズドラパス
        </label>

        <div class="radio-group">
            <label>
                <input
                    type="radio"
                    name="member"
                    value="1"
                    checked
                >
                非会員
            </label>

            <label>
                <input
                    type="radio"
                    name="member"
                    value="1.05"
                >
                会員（×1.05）
            </label>
        </div>

        <label for="dumbo">
            ダンボ数
        </label>

        <input
            type="number"
            id="dumbo"
            value="0"
            min="0"
        >

        <label for="leader">
            リーダー経験値倍率
        </label>

        <select id="leader"></select>

        <label for="friend">
            フレンド経験値倍率
        </label>

        <select id="friend"></select>

        <div class="result-box">

            <div class="result-title">
                1周あたりの経験値
            </div>

            <div class="result" id="result">
                0 EXP
            </div>

            <div class="easy-result" id="easyResult">
                0
            </div>

            <div class="info">
                通常経験値：<span id="baseExp">80,000,000</span>
            </div>

            <div class="info">
                コラボ・イベントキャラ数加算経験値：<span id="collabExp">+0</span>
            </div>

            <div class="info">
                経験値バッジ・パズドラパス合計倍率：×<span id="badgeMemberRate">1.00</span>
            </div>

            <div class="info">
                リーダー・フレンド経験値倍率：×<span id="leaderFriendRate">1.00</span>
            </div>

            <div class="info">
                ダンボ倍率：×<span id="dumboRate">1.00</span>
            </div>

            <div class="info">
                経験値倍率（合計）：×<span id="expRate">1.00</span>
            </div>

        </div>


        <!-- 時速計算 -->

        <h2>時速計算</h2>

        <label>
            1周のタイム
        </label>

        <div class="time-group">

            <input
                type="number"
                id="runMinutes"
                value="1"
                min="0"
            >

            <span>分</span>

            <input
                type="number"
                id="runSeconds"
                value="30"
                min="0"
                max="59"
            >

            <span>秒</span>

        </div>

        <div class="result-box">

            <div class="result-title">
                1時間あたりの周回数
            </div>

            <div class="run-result" id="runCount">
                0周
            </div>


        </div>

        <div class="result-box">

            <div class="result-title">
                1時間あたりの獲得経験値
            </div>

            <div class="run-result" id="hourExp">
                0 EXP
            </div>

            <div class="run-easy-result" id="hourEasyExp">
                0
            </div>

        </div>

        </section>

        <section class="panel" id="dropPanel" role="tabpanel" aria-labelledby="dropTab" hidden>
            <h2>基本設定</h2>
            <label for="baseDrop">基礎ドロップ率（%）</label>
            <input type="number" id="baseDrop" value="15" min="0" step="any">
            <label for="dropLeader">リーダーのドロップ倍率</label>
            <select id="dropLeader" aria-label="リーダーのドロップ倍率"></select>
            <label for="dropFriendExp">フレンドの経験値倍率</label>
            <select id="dropFriendExp" aria-label="フレンドの経験値倍率"></select>
            <label for="dropDumbo">ダンボ数</label>
            <input type="number" id="dropDumbo" value="0" min="0" step="1" inputmode="numeric">
            <div class="result-box" aria-live="polite">
                <div class="result-title">結果の値</div>
                <div class="drop-result" id="dropResult">15%</div>
                <div class="info">リーダー・フレンドのドロップ倍率：×<span id="dropCombinedRate">1</span></div>
                <div class="info">ダンボ：<span id="dropDumboSummary">0個（+0%）</span></div>
            </div>
        </section>
    </div>


    <script>

        // リーダー・フレンド倍率を作成
        function createMultiplierOptions(id) {

            const select = document.getElementById(id);

            for (let i = 10; i <= 30; i++) {

                const value = i / 10;

                const option =
                    document.createElement("option");

                option.value = value;

                option.textContent =
                    value.toFixed(1) + "倍";

                select.appendChild(option);
            }
        }

        createMultiplierOptions("leader");
        createMultiplierOptions("friend");
        createMultiplierOptions("dropLeader");
        createMultiplierOptions("dropFriendExp");


        // 経験値を日本語表記に変換
        function convertToJapanese(num) {

            num = Math.floor(num);

            const trillion =
                Math.floor(
                    num / 1000000000000
                );

            const billion =
                Math.floor(
                    (num % 1000000000000) /
                    100000000
                );

            const tenThousand =
                Math.floor(
                    (num % 100000000) /
                    10000
                );

            // 下4桁
            const lower4 =
                num % 10000;

            let result = "";

            if (trillion > 0) {
                result += trillion + "兆";
            }

            if (billion > 0) {
                result += billion + "億";
            }

            if (tenThousand > 0) {
                result += tenThousand + "万";
            }

            // 下4桁が0ではない場合だけ表示
            if (lower4 > 0) {
                result += lower4;
            }

            if (result === "") {
                result = "0";
            }

            return result;
        }


        let currentExp = 0;


        // まとめて計算
        function calculateAll() {
            calculateExp();
            calculateRuns();
        }


        // 経験値計算
        function formatMultiplier(value) {
            // 小数第2位などで丸めず、意味のある桁まで表示
            // 浮動小数点の誤差（1.1550000000000002など）を除去
            return Number(value.toPrecision(15)).toString();
        }


        function calculateExp() {

            let normalExp =
                Number(
                    document.getElementById("normalExp").value
                );

            let collab =
                Number(
                    document.getElementById("collab").value
                );

            let dumbo =
                Number(
                    document.getElementById("dumbo").value
                );

            // コラボキャラクター最大6体
            if (collab > 6) {

                collab = 6;

                document.getElementById("collab").value = 6;
            }

            if (collab < 0) {

                collab = 0;

                document.getElementById("collab").value = 0;
            }

            if (dumbo < 0) {

                dumbo = 0;

                document.getElementById("dumbo").value = 0;
            }


            // コラボキャラクター追加分
            const collabExp =
                collab * 40000000;


            // 通常経験値
            const baseExp =
                normalExp + collabExp;


            // 経験値バッジ
            const badge =
                Number(
                    document.querySelector(
                        'input[name="badge"]:checked'
                    ).value
                );


            // パズドラパス
            const member =
                Number(
                    document.querySelector(
                        'input[name="member"]:checked'
                    ).value
                );


            // ダンボ倍率
            const dumboRate =
                1 + (dumbo * 0.02);


            // リーダー倍率
            const leader =
                Number(
                    document.getElementById("leader").value
                );


            // フレンド倍率
            const friend =
                Number(
                    document.getElementById("friend").value
                );


            // 経験値バッジ・パズドラパス合計倍率
            const badgeMemberRate =
                badge * member;

            // リーダー・フレンド経験値倍率
            const leaderFriendRate =
                leader * friend;

            // 経験値倍率（合計）
            // 「バッジ・パズドラパス」×「リーダー・フレンド」×「ダンボ」
            const expRate =
                badgeMemberRate *
                leaderFriendRate *
                dumboRate;


            // 最終経験値
            const finalExp =
                Math.floor(
                    baseExp * expRate
                );


            // 計算した1周経験値を保存
            currentExp = finalExp;

            // 結果表示
            document.getElementById("baseExp").textContent =
                normalExp.toLocaleString();

            document.getElementById("collabExp").textContent =
                "+" + collabExp.toLocaleString();

            document.getElementById("badgeMemberRate").textContent =
                formatMultiplier(badgeMemberRate);

            document.getElementById("leaderFriendRate").textContent =
                leaderFriendRate.toFixed(2);

            document.getElementById("dumboRate").textContent =
                dumboRate.toFixed(2);

            document.getElementById("expRate").textContent =
                formatMultiplier(expRate);

            document.getElementById("result").textContent =
                finalExp.toLocaleString() + " EXP";

            document.getElementById("easyResult").textContent =
                convertToJapanese(finalExp);


        }


        // 1時間あたりの周回数・経験値を計算
        function calculateRuns() {

            const minutes =
                Number(
                    document.getElementById("runMinutes").value
                );

            const seconds =
                Number(
                    document.getElementById("runSeconds").value
                );


            // 1周の秒数
            const totalSeconds =
                (minutes * 60) + seconds;


            // タイムが0の場合
            if (totalSeconds <= 0) {

                document.getElementById("runCount").textContent =
                    "0周";

                document.getElementById("hourExp").textContent =
                    "0 EXP";

                document.getElementById("hourEasyExp").textContent =
                    "0";

                return;
            }


            // 1時間あたりの周回数
            const runCount =
                Math.floor(
                    3600 / totalSeconds
                );


            // 現在の1周経験値
            const oneRunExp = currentExp;


            // 1時間あたりの経験値
            const hourExp =
                oneRunExp * runCount;


            // 表示
            document.getElementById("runCount").textContent =
                runCount + "周";

            document.getElementById("hourExp").textContent =
                hourExp.toLocaleString() + " EXP";

            document.getElementById("hourEasyExp").textContent =
                convertToJapanese(hourExp);
        }

        function calculateDrop() {
            const base = Math.max(0, Number(document.getElementById("baseDrop").value) || 0);
            const leader = Math.max(0, Number(document.getElementById("dropLeader").value) || 0);
            const count = Math.floor(Math.max(0, Number(document.getElementById("dropDumbo").value) || 0));
            const friendExp = Math.max(0, Number(document.getElementById("dropFriendExp").value) || 0);
            const dumboBonusPercent = count * 2;
            const combinedRate = leader * friendExp;
            const finalRate = base * leader * friendExp + dumboBonusPercent;
            document.getElementById("dropResult").textContent = Number(finalRate.toPrecision(12)).toLocaleString("ja-JP") + "%";
            document.getElementById("dropCombinedRate").textContent = Number(combinedRate.toPrecision(8)).toLocaleString("ja-JP");
            document.getElementById("dropDumboSummary").textContent = `${count}個（+${dumboBonusPercent}%）`;
        }

        document.querySelectorAll("#expPanel input, #expPanel select").forEach((field) => {
            field.addEventListener("input", calculateAll);
            field.addEventListener("change", calculateAll);
        });
        document.querySelectorAll("#dropPanel input, #dropPanel select").forEach((field) => {
            field.addEventListener("input", calculateDrop);
            field.addEventListener("change", calculateDrop);
        });
        document.getElementById("expTab").addEventListener("click", () => setTab("exp"));
        document.getElementById("dropTab").addEventListener("click", () => setTab("drop"));
        function setTab(name) {
            const exp = name === "exp";
            document.getElementById("expPanel").hidden = !exp;
            document.getElementById("dropPanel").hidden = exp;
            document.getElementById("expTab").setAttribute("aria-selected", String(exp));
            document.getElementById("dropTab").setAttribute("aria-selected", String(!exp));
        }

        calculateAll();
        calculateDrop();


    </script>

</body>

</html>
